# Serves the built dashboard and proxies /api to the API container, so the browser
# talks to one origin and the API needs no CORS in production.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Snapshot data is untrusted. React escapes it; this policy is the second line of
    # defence: no inline scripts, nothing loaded from other origins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Resolve the api service at request time through Docker's DNS, so nginx starts
        # even when the API is down and recovers when it comes back.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes such as /scans/<id> all serve the app.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
